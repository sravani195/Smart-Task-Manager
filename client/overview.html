<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overview - Smart Task Manager</title>
  <link rel="stylesheet" href="/assets/css/dashboard-style.css">
  <link rel="stylesheet" href="/assets/css/overview-style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="top-bar">
    <h2>Smart Task Manager</h2>
  </header>

  <main class="overview-main">
    <!-- Stats -->
    <section class="stats-container">
      <div class="stat-box" id="completedBox">
        <h3>Completed Tasks</h3>
        <p id="completedCount">0</p>
      </div>
      <div class="stat-box" id="pendingBox">
        <h3>Pending Tasks</h3>
        <p id="pendingCount">0</p>
      </div>
    </section>

    <!-- Charts -->
    <section class="charts-container">
      <div class="chart-box">
        <h3>Completed vs Pending</h3>
        <canvas id="pieChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Pending Tasks by Category</h3>
        <canvas id="categoryDonutChart"></canvas>
      </div>
    </section>

    <!-- Upcoming Tasks Module -->
    <section class="upcoming-tasks-container">
      <div class="chart-box" style="width:100%;">
        <h3>Pending Tasks — Next 7 Days</h3>
        <ul id="upcomingTasks" style="list-style:none; padding:0; margin:0;"></ul>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-bar">
    <button id="nav-tasks" class="nav-btn">
      <span class="material-icons">list</span><br>Tasks
    </button>
    <button id="nav-calendar" class="nav-btn">
      <span class="material-icons">calendar_month</span><br>Calendar
    </button>
    <button id="nav-profile" class="nav-btn active">
      <span class="material-icons">person</span><br>Profile
    </button>
  </nav>

  <script src="/assets/js/overview.js"></script>
</body>
</html>
